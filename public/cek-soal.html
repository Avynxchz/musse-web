<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Soal MUSSE (internal)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #f1f1f1; color: #111; font-size: 14px; }
  .bar { position: sticky; top: 0; z-index: 10; background: #111; color: #fff; padding: 10px 12px; }
  .bar h1 { margin: 0 0 8px; font-size: 16px; }
  .bar .row { display: flex; gap: 8px; }
  select, button.load { flex: 1; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
  button.load { flex: 0 0 auto; background: #B6FF00; color: #111; font-weight: 700; border: none; cursor: pointer; }
  #status { padding: 10px 12px; font-size: 13px; color: #555; }
  .soal { background: #fff; margin: 10px; border-radius: 10px; padding: 14px; border: 1px solid #ddd; }
  .soal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .no { font-size: 20px; font-weight: 800; }
  .tipe { font-size: 11px; background: #eee; padding: 3px 8px; border-radius: 20px; color: #555; }
  .topik { font-size: 12px; color: #888; margin-bottom: 8px; }
  .sec-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 6px; }
  .stimulus { background: #f8f9ff; border-left: 3px solid #4F46E5; padding: 8px 10px; margin: 8px 0; border-radius: 0 8px 8px 0; }
  .pertanyaan { font-size: 15px; line-height: 1.6; margin: 8px 0; }
  .pertanyaan img, .stimulus img { max-width: 100%; height: auto; display: block; margin: 10px auto; max-height: 360px; object-fit: contain; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
  .pertanyaan img.inline-symbol-img, .stimulus img.inline-symbol-img, .opsi img.inline-symbol-img, .stmt img.inline-symbol-img { display: inline-block; margin: 0 3px; max-height: 3.2em; vertical-align: middle; border: none; }
  .opsi { display: flex; gap: 10px; align-items: flex-start; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; margin: 6px 0; }
  .opsi .key { font-weight: 800; min-width: 22px; }
  .opsi .body { flex: 1; line-height: 1.5; }
  .opsi .body img { max-height: 120px; max-width: 100%; vertical-align: middle; }
  .opsi.benar { border-color: #16a34a; background: #f0fdf4; }
  .stmt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; margin: 6px 0; }
  .stmt .key { font-weight: 800; min-width: 22px; }
  .stmt .body { flex: 1; line-height: 1.5; }
  .stmt .body img { max-height: 60px; max-width: 100%; vertical-align: middle; }
  .stmt.benar { border-color: #16a34a; background: #f0fdf4; }
  .stmt.salah { border-color: #dc2626; background: #fef2f2; }
  .kunci-box { margin-top: 12px; padding: 8px 10px; background: #fffbeb; border: 1px dashed #d97706; border-radius: 8px; font-size: 13px; }
  .kunci-box b { color: #b45309; }
  .app-lama { display: inline-block; margin-top: 10px; font-size: 12px; padding: 8px 12px; background: #111; color: #fff; border-radius: 8px; text-decoration: none; }
  .nav { position: sticky; bottom: 0; background: #111; padding: 8px 12px; display: flex; gap: 8px; z-index: 10; }
  .nav button { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #B6FF00; color: #111; font-weight: 700; cursor: pointer; }
  .img-missing { color: #dc2626; font-size: 12px; font-style: italic; }
</style>
</head>
<body>
<div class="bar">
  <h1>🔍 Cek Soal (internal)</h1>
  <div class="row">
    <select id="mapel"></select>
    <select id="paket"></select>
    <button class="load" onclick="muat()">Muat</button>
  </div>
</div>
<div id="status">Pilih mapel + paket, lalu tekan Muat.</div>
<div id="list"></div>
<div class="nav" id="jumpnav" style="display:none">
  <button onclick="jump(-1)">⬆ Soal sebelumnya</button>
  <button onclick="jump(1)">⬇ Soal berikutnya</button>
</div>

<script>
const SUPA = 'https://auhqgzrrgvjbfvzvayzg.supabase.co';
const OLDAPP = 'https://tka-master.up.railway.app';

// key = app key, db = nama di storage, p2 = ada paket 2?
const MAPEL = [
  ['matematika','matematika','Matematika (Wajib)',true],
  ['indonesia','bahasa_indonesia','B. Indonesia (Wajib)',true],
  ['inggris','bahasa_inggris','B. Inggris (Wajib)',true],
  ['ppkn','ppkn','PPKn (Wajib)',true],
  ['fisika','fisika','Fisika',true],
  ['kimia','kimia','Kimia',true],
  ['biologi','biologi','Biologi',true],
  ['matlanjut','matematika_lanjut','Matematika Lanjut',true],
  ['ekonomi','ekonomi','Ekonomi',true],
  ['sosiologi','sosiologi','Sosiologi',true],
  ['geografi','geografi','Geografi',true],
  ['sejarah','sejarah','Sejarah',true],
  ['antropologi','antropologi','Antropologi',true],
  ['tkj','teknik_jaringan','SMK - Teknik Jaringan (TKJ)',false],
  ['tkr','teknik_otomotif','SMK - Teknik Otomotif (TKR)',false],
  ['akuntansi','akuntansi','SMK - Akuntansi',false],
  ['mp','manajemen_perkantoran','SMK - Manajemen Perkantoran',false],
  ['mesin','teknik_mesin','SMK - Teknik Mesin',false],
  ['kewirausahaan','kewirausahaan','SMK - Kewirausahaan',true],
  ['arab','bahasa_arab','Bahasa Arab',true],
  ['jepang','bahasa_jepang','Bahasa Jepang',true],
  ['jerman','bahasa_jerman','Bahasa Jerman',true],
  ['korea','bahasa_korea','Bahasa Korea',true],
  ['mandarin','bahasa_mandarin','Bahasa Mandarin',true],
  ['prancis','bahasa_prancis','Bahasa Prancis',true],
  ['indonesia_lanjut','bahasa_indonesia_lanjut','B. Indonesia Lanjut',true],
  ['inggris_lanjut','bahasa_inggris_lanjut','B. Inggris Lanjut',true],
];

const mapelSel = document.getElementById('mapel');
const paketSel = document.getElementById('paket');
MAPEL.forEach(([k,db,name]) => {
  const o = document.createElement('option');
  o.value = db; o.textContent = name; o.dataset.key = k;
  mapelSel.appendChild(o);
});
function isiPaket() {
  const m = MAPEL.find(x => x[1] === mapelSel.value);
  paketSel.innerHTML = '';
  [1,2].forEach(n => {
    if (n === 2 && !m[3]) return;
    const o = document.createElement('option');
    o.value = n; o.textContent = 'Paket ' + n;
    paketSel.appendChild(o);
  });
}
mapelSel.onchange = isiPaket;
isiPaket();

function imgBase(db, paket) {
  return `${SUPA}/storage/v1/object/public/soal-images/${db}_paket_${paket}/`;
}

// Ganti src gambar lama -> Supabase. Kembalikan {html, missing:[nama file yg gagal]}.
function fixHtml(html, db, paket) {
  if (!html) return '';
  const base = imgBase(db, paket);
  return html.replace(/src\s*=\s*["']([^"']+)["']/gi, (m, src) => {
    if (/^https?:\/\//i.test(src)) return m; // sudah URL penuh
    const fn = src.split('/').pop().split('?')[0].split('#')[0];
    if (!fn || !/\.(png|jpe?g|gif|webp|svg)$/i.test(fn)) return m;
    return `src="${base}${fn}"`;
  });
}

function imgTag(url, alt) {
  return `<img src="${url}" alt="${alt||'gambar soal'}" loading="lazy" onerror="this.outerHTML='<span class=img-missing>[gambar gagal dimuat]</span>'">`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let curDb = '', curPaket = 1, curSoal = [];

async function muat() {
  const db = mapelSel.value, paket = parseInt(paketSel.value, 10);
  curDb = db; curPaket = paket;
  const st = document.getElementById('status');
  const list = document.getElementById('list');
  st.textContent = '⏳ Memuat ' + db + ' paket ' + paket + '...';
  list.innerHTML = '';
  try {
    const res = await fetch(`${SUPA}/storage/v1/object/public/soal/${db}_paket_${paket}.json`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    data.sort((a,b) => a.nomor - b.nomor);
    curSoal = data;
    st.textContent = `✅ ${data.length} soal dimuat. Scroll untuk cek semua.`;
    document.getElementById('jumpnav').style.display = 'flex';
    list.innerHTML = data.map((q,i) => renderSoal(q, i, db, paket)).join('');
    // tandai gambar kecil sebagai inline
    list.querySelectorAll('img').forEach(img => {
      const mark = () => {
        const h = img.naturalHeight || 0;
        if (h > 0 && h <= 65) img.classList.add('inline-symbol-img');
      };
      if (img.complete) mark(); else img.onload = mark;
    });
  } catch(e) {
    st.textContent = '❌ Gagal: ' + e.message;
  }
}

function renderSoal(q, idx, db, paket) {
  const id = 'soal-' + q.nomor;
  let h = `<div class="soal" id="${id}">`;
  h += `<div class="soal-head"><span class="no">No. ${q.nomor}</span><span class="tipe">${esc(q.tipe||'')}</span></div>`;
  if (q.mapel_nama) h += `<div class="topik">${esc(q.mapel_nama)} · Paket ${paket}</div>`;

  // --- Stimulus ---
  const stim = q.stimulus || {};
  const stimHtml = fixHtml(stim.html, db, paket);
  const stimImgs = (stim.images || []).map(im => im && im.filename).filter(Boolean);
  const stimHtmlHasImg = /<img/i.test(stimHtml);
  if (stimHtml || (stim.text||'').trim() || stimImgs.length) {
    h += `<div class="sec-label">Stimulus</div><div class="stimulus">`;
    if (stimHtml) h += stimHtml;
    else if ((stim.text||'').trim()) h += `<div>${esc(stim.text)}</div>`;
    if (!stimHtmlHasImg) stimImgs.forEach(fn => { h += imgTag(imgBase(db,paket)+fn, 'stimulus'); });
    h += `</div>`;
  }

  // --- Pertanyaan ---
  const pert = q.pertanyaan || {};
  const pertHtml = fixHtml(pert.html, db, paket);
  const pertImgs = (pert.images || []).map(im => im && im.filename).filter(Boolean);
  const pertHtmlHasImg = /<img/i.test(pertHtml);
  h += `<div class="sec-label">Pertanyaan</div><div class="pertanyaan">`;
  if (pertHtml) h += pertHtml;
  else if ((pert.text||'').trim()) h += esc(pert.text);
  else h += `<span class="img-missing">[tidak ada teks pertanyaan]</span>`;
  if (!pertHtmlHasImg) pertImgs.forEach(fn => { h += imgTag(imgBase(db,paket)+fn, 'gambar soal'); });
  h += `</div>`;

  // --- Opsi PG ---
  if (q.pilihan && q.pilihan.length) {
    h += `<div class="sec-label">Opsi Jawaban</div>`;
    const kunciPG = q.kunci;
    q.pilihan.forEach(p => {
      const isBenar = Array.isArray(kunciPG) ? kunciPG.includes(p.key) : kunciPG === p.key;
      const optHtml = fixHtml(p.html, db, paket);
      let body = '';
      if (optHtml) body = optHtml;
      else {
        if (p.image && p.image.filename) body += imgTag(imgBase(db,paket)+p.image.filename, 'opsi '+p.key) + ' ';
        body += p.text && p.text.trim() ? esc(p.text) : (p.latex ? '[latex: '+esc(p.latex)+']' : '');
      }
      h += `<div class="opsi${isBenar?' benar':''}"><span class="key">${esc(p.key)}.</span><span class="body">${body}</span></div>`;
    });
  }

  // --- Pernyataan (Benar-Salah / Matriks / Label) ---
  if (q.pernyataan && q.pernyataan.length) {
    h += `<div class="sec-label">Pernyataan</div>`;
    const kunciMap = {};
    (Array.isArray(q.kunci) ? q.kunci : []).forEach(k => {
      const i = String(k).indexOf(':');
      if (i > 0) kunciMap[String(k).slice(0,i)] = String(k).slice(i+1);
    });
    q.pernyataan.forEach(s => {
      const val = kunciMap[s.key] || '';
      const cls = /benar|tepat/i.test(val) ? ' benar' : (/salah|tidak/i.test(val) ? ' salah' : '');
      const sHtml = fixHtml(s.html, db, paket);
      let body = '';
      if (sHtml) body = sHtml;
      else {
        if (s.image && s.image.filename) body += imgTag(imgBase(db,paket)+s.image.filename, 'pernyataan '+s.key) + ' ';
        body += s.text && s.text.trim() ? esc(s.text) : (s.latex ? '[latex: '+esc(s.latex)+']' : '<span class="img-missing">[kosong]</span>');
      }
      if (val) body += ` <b>(${esc(val)})</b>`;
      h += `<div class="stmt${cls}"><span class="key">${esc(s.key)}.</span><span class="body">${body}</span></div>`;
    });
  }

  // --- Kunci ---
  h += `<div class="kunci-box"><b>Kunci:</b> ${esc(Array.isArray(q.kunci) ? q.kunci.join(', ') : String(q.kunci ?? '-'))}</div>`;

  // --- Link app lama ---
  h += `<a class="app-lama" target="_blank" href="${OLDAPP}/app?subject=${db}&paket=${paket}">🔗 Buka di App Lama</a>`;

  h += `</div>`;
  return h;
}

let jumpIdx = -1;
function jump(dir) {
  const els = document.querySelectorAll('.soal');
  if (!els.length) return;
  jumpIdx = Math.min(Math.max(jumpIdx + dir, 0), els.length - 1);
  els[jumpIdx].scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('status').textContent = `Soal ${jumpIdx+1} dari ${els.length}`;
}
</script>
</body>
</html>
